# Main-site Circle USDC public demo; install only after fixed root policy/runtime verification.
# HTTP scope must define capture402_main_public_post (POST IP; other methods empty)
# and its capture402_main_demo_public limit_req_zone at 20r/m.
# /merchant inherits the existing operator allowlist. Facilitator stays private.
large_client_header_buffers 4 16k;
client_max_body_size 32k;
add_header X-Capture402-Environment main-circle always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Cache-Control "no-store" always;
proxy_hide_header Cache-Control;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Connection "";
proxy_pass_request_headers on;
proxy_intercept_errors off;
proxy_buffering off;
proxy_next_upstream off;
proxy_connect_timeout 5s;
proxy_read_timeout 450s;
proxy_send_timeout 450s;
location = / {
    allow all;
    limit_req zone=capture402_main_demo_public burst=12 nodelay;
    limit_req_status 429;
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:8898;
}
location ~ "^/(integrate|evidence|customer|assets/(guide\\.css|homepage\\.css|homepage\\.js|app\\.js|payment-profile\\.js|receipt-state\\.js|wallet\\.js|solflare\\.js|solflare\\.js\\.LEGAL\\.txt|style\\.css)|api/config)$" {
    allow all;
    limit_req zone=capture402_main_demo_public burst=12 nodelay;
    limit_req_status 429;
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:8898;
}
location = /resource {
    allow all;
    limit_req zone=capture402_main_demo_public burst=12 nodelay;
    limit_req_status 429;
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    proxy_pass http://127.0.0.1:8898;
}
location = /api/orders {
    allow all;
    limit_req zone=capture402_main_demo_public burst=12 nodelay;
    limit_req_status 429;
    if ($request_method != POST) { return 405; }
    proxy_pass http://127.0.0.1:8898;
}
location ~ "^/api/orders/[a-f0-9]{32}/signing-preflight$" {
    allow all;
    limit_req zone=capture402_main_demo_public burst=12 nodelay;
    limit_req_status 429;
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:8898;
}
location ~ "^/api/orders/[a-f0-9]{32}/session$" {
    allow all;
    limit_req zone=capture402_main_demo_public burst=12 nodelay;
    limit_req_status 429;
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    proxy_pass http://127.0.0.1:8898;
}
location ~ "^/api/orders/[a-f0-9]{32}/(wallet-consent|reclaim-renewal|abandon-authorize|merchant-demo)$" {
    allow all;
    limit_req zone=capture402_main_demo_public burst=12 nodelay;
    limit_req_status 429;
    if ($request_method != POST) { return 405; }
    proxy_pass http://127.0.0.1:8898;
}
location ~ "^/api/orders/[a-f0-9]{32}(/actions/(beer|salmon|finish|void|refund|atomic)|/reclaim)?$" {
    allow all;
    limit_req zone=capture402_main_demo_public burst=12 nodelay;
    limit_req_status 429;
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    proxy_pass http://127.0.0.1:8898;
}
location = /merchant {
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:8898;
}
# The faucet limits treasury RPC inspections globally to 60 per minute.
# This exact read-only route preserves recipient queries without exposing /faucet.
location = /api/faucet/status {
    allow all;
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:8898;
}
location ~ "^/api/faucet/(challenge|claim)$" {
    allow all;
    limit_req zone=capture402_main_demo_public burst=12 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    if ($request_method != POST) { return 405; }
    proxy_pass http://127.0.0.1:8898;
}
location ~ "^/api/faucet/claims/[a-f0-9]{64}$" {
    allow all;
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:8898;
}
location / { return 404; }
